name: Gate - Hygiene

on:
  workflow_call:
    inputs:
      dup-max-percent: { type: string, default: "5" }
      dep-block:       { type: string, default: "false" }
      dup-ignore:      { type: string, default: "" }   # extra globs, comma separated

permissions:
  contents: read
  pull-requests: write

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  EVENT_NAME: ${{ github.event_name }}

jobs:
  hygiene:
    name: Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUP_MAX_PERCENT: ${{ inputs.dup-max-percent }}
      DEP_BLOCK: ${{ inputs.dep-block }}
      DUP_IGNORE: ${{ inputs.dup-ignore }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: |
          mkdir -p out
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x osv-scanner

      # ───── 1. Duplication (all languages) ─────
      - name: Duplication
        id: dup
        continue-on-error: true
        run: |
          set +e
          IGN="**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/runtime/**,**/tests/**,**/test/**,**/__tests__/**,**/*.min.js,**/*.lock,**/package-lock.json,**/migrations/**"
          [ -n "$DUP_IGNORE" ] && IGN="$IGN,$DUP_IGNORE"
          npx --yes jscpd@4.0.5 . --min-lines 10 --min-tokens 70 \
            --ignore "$IGN" --reporters json --output jscpd-report --silent
          S=jscpd-report/jscpd-report.json
          if [ ! -f "$S" ]; then
            printf '### 1. Duplication: ✅ PASSED\n\nNo supported source files found, skipped.\n' > out/dup.md
            exit 0
          fi
          PCT=$(jq '.statistics.total.percentage // 0' $S)
          LINES=$(jq '.statistics.total.duplicatedLines // 0' $S)
          CLONES=$(jq '.statistics.total.clones // 0' $S)
          FAIL=0
          awk -v p="$PCT" -v m="$DUP_MAX_PERCENT" 'BEGIN{exit !(p<=m)}' || FAIL=1
          {
            echo "### 1. Duplication: $([ $FAIL = 0 ] && echo '✅ PASSED' || echo '❌ FAILED')"; echo
            echo "| Metric | Value |"; echo "|---|---|"
            echo "| Duplicated code | **${PCT}%** (limit ${DUP_MAX_PERCENT}%) |"
            echo "| Duplicated lines | $LINES |"
            echo "| Clone blocks | $CLONES |"; echo
            echo "**Top 15 clones**"; echo
            echo "| File A | File B | Lines |"; echo "|---|---|---|"
            jq -r '(.duplicates // [])[:15][] | "| `\(.firstFile.name):\(.firstFile.start)` | `\(.secondFile.name):\(.secondFile.start)` | \(.lines) |"' $S
          } > out/dup.md
          exit $FAIL

      # ───── 2. Secrets in git history ─────
      - name: Secrets
        id: sec
        continue-on-error: true
        run: |
          set +e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./gitleaks git --redact --no-banner --exit-code 0 -f json -r all.json
          [ -s all.json ] || echo "[]" > all.json
          ALL=$(jq length all.json); NEW=0
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./gitleaks git --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner --exit-code 0 -f json -r new.json
            [ -s new.json ] || echo "[]" > new.json
            NEW=$(jq length new.json); GATE=$NEW
          else
            GATE=$ALL
          fi
          FAIL=0; [ "${GATE:-0}" -gt 0 ] && FAIL=1
          {
            echo "### 2. Secrets: $([ $FAIL = 0 ] && echo '✅ PASSED' || echo '❌ FAILED')"; echo
            echo "| Scope | Secrets found | Blocks |"; echo "|---|---|---|"
            [ "$EVENT_NAME" = "pull_request" ] && echo "| Commits in this PR | $NEW | **Yes** |"
            echo "| Entire git history | $ALL | $([ "$EVENT_NAME" = "pull_request" ] && echo 'No (report only)' || echo '**Yes**') |"; echo
            echo "**Findings (values redacted, first 50)**"; echo
            echo "| Rule | Location | Commit | Author |"; echo "|---|---|---|---|"
            jq -r '.[:50][] | "| `\(.RuleID)` | `\(.File):\(.StartLine)` | `\(.Commit[0:7])` | \(.Author) |"' all.json
            echo
            echo "<sub>A leaked secret must be **rotated**, not just removed. False positives: add an allowlist to \`.gitleaks.toml\`.</sub>"
          } > out/sec.md
          exit $FAIL

      # ───── 3. Dependencies (any lockfile, any language) ─────
      - name: Dependencies
        id: dep
        continue-on-error: true
        run: |
          set +e
          ./osv-scanner scan -r --format json --output osv.json .
          RC=$?
          # 0 = clean, 1 = vulnerabilities found, 128 = no lockfiles found, other = tool error
          if [ "$RC" -eq 128 ]; then
            printf '### 3. Dependencies: ✅ PASSED\n\nNo lockfiles found (composer.lock, package-lock.json, yarn.lock, requirements.txt, poetry.lock, go.mod, pom.xml, ...). Skipped.\n' > out/dep.md
            exit 0
          fi
          [ -s osv.json ] || echo '{"results":[]}' > osv.json
          COUNT=$(jq '[.results[].packages[]?.vulnerabilities[]?] | length' osv.json)
          FILES=$(jq '[.results[].source.path] | unique | length' osv.json)
          FAIL=0
          [ "$RC" -gt 1 ] && FAIL=1
          [ "$DEP_BLOCK" = "true" ] && [ "$COUNT" -gt 0 ] && FAIL=1
          {
            echo "### 3. Dependencies: $([ $FAIL = 0 ] && echo '✅ PASSED' || echo '❌ FAILED')"; echo
            echo "| Metric | Value |"; echo "|---|---|"
            echo "| Lockfiles with findings | $FILES |"
            echo "| Vulnerabilities | **$COUNT** |"
            echo "| Blocking | \`DEP_BLOCK=$DEP_BLOCK\` |"
            [ "$RC" -gt 1 ] && echo "| Scanner exit code | $RC (tool error) |"
            echo
            echo "| Lockfile | Package | Version | Advisory | Summary |"; echo "|---|---|---|---|---|"
            jq -r '.results[] | .source.path as $f | .packages[]? | .package.name as $n | .package.version as $v | .vulnerabilities[] | "| `\($f)` | `\($n)` | \($v) | \(.id) | \((.summary // "") | gsub("[|\n]";" ") | .[0:80]) |"' osv.json | head -60
          } > out/dep.md
          exit $FAIL

      # ───── Combined report ─────
      - name: Combined report
        if: always()
        env:
          DUP: ${{ steps.dup.outcome }}
          SEC: ${{ steps.sec.outcome }}
          DEP: ${{ steps.dep.outcome }}
        run: |
          mark() { [ "$1" = "success" ] && echo "✅ PASSED" || echo "❌ FAILED"; }
          FAIL=0
          for s in "$DUP" "$SEC" "$DEP"; do [ "$s" = "success" ] || FAIL=1; done
          echo "$FAIL" > fail.txt
          {
            echo "## Hygiene Gate: $([ $FAIL = 0 ] && echo '✅ PASSED' || echo '❌ FAILED')"; echo
            echo "| Check | Result |"; echo "|---|---|"
            echo "| Duplication | $(mark "$DUP") |"
            echo "| Secrets | $(mark "$SEC") |"
            echo "| Dependencies | $(mark "$DEP") |"
            echo "| Commit | \`${HEAD_SHA:0:7}\` |"; echo
            for f in out/dup.md out/sec.md out/dep.md; do
              [ -f "$f" ] && { cat "$f"; echo; }
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: Prithish-Ghosh/semgrep/actions/comment@v1.0.3
        if: always()
        with:
          marker: gate-hygiene
          file: report.md
          token: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hygiene-reports
          path: |
            jscpd-report/
            all.json
            new.json
            osv.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce gate
        run: '[ "$(cat fail.txt)" = "0" ]'