name: Gate - Coverage

on:
  workflow_call:
    inputs:
      diff-coverage-min: { type: string, default: "80" }
      runtime:           { type: string, default: "none" }   
      runtime-version:   { type: string, default: "" }       
      install-command:   { type: string, default: "" }       
      test-command:      { type: string, default: "" }      
      coverage-file:     { type: string, default: "coverage.xml" }  

permissions:
  contents: read
  pull-requests: write

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  EVENT_NAME: ${{ github.event_name }}

jobs:
  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIFF_COVERAGE_MIN: ${{ inputs.diff-coverage-min }}
      INSTALL_CMD: ${{ inputs.install-command }}
      TEST_CMD: ${{ inputs.test-command }}
      COV_FILE: ${{ inputs.coverage-file }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.runtime == 'python' && (inputs.runtime-version || '3.12') || '3.12' }}

      - uses: actions/setup-node@v4
        if: ${{ inputs.runtime == 'node' }}
        with:
          node-version: ${{ inputs.runtime-version || '20' }}

      - uses: shivammathur/setup-php@v2
        if: ${{ inputs.runtime == 'php' }}
        with:
          php-version: ${{ inputs.runtime-version || '8.2' }}
          coverage: pcov
          tools: composer

      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        run: bash -c "$INSTALL_CMD"

      - name: Run tests, measure coverage
        run: |
          set +e
          FAIL=0; DIFF="n/a"; TESTS="n/a"; SKIP=0
          if [ -z "$TEST_CMD" ]; then
            SKIP=1; TESTS="skipped (no test-command configured for this repo)"
          else
            bash -c "$TEST_CMD"
            if [ $? -eq 0 ]; then TESTS="✅ passed"; else TESTS="❌ failed"; FAIL=1; fi
            if [ ! -f "$COV_FILE" ]; then
              FAIL=1; TESTS="$TESTS, ❌ $COV_FILE not generated"
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              pip install -q diff-cover==9.2.0
              diff-cover "$COV_FILE" --compare-branch="$BASE_SHA" \
                --fail-under="$DIFF_COVERAGE_MIN" --markdown-report diff-cover.md
              if [ $? -eq 0 ]; then DIFF="✅ ≥ ${DIFF_COVERAGE_MIN}%"; else DIFF="❌ < ${DIFF_COVERAGE_MIN}%"; FAIL=1; fi
            else
              DIFF="n/a (PR only)"
            fi
          fi
          echo "$FAIL" > fail.txt
          {
            echo "## Coverage Gate: $([ $SKIP = 1 ] && echo '⏭️ SKIPPED' || { [ $FAIL = 0 ] && echo '✅ PASSED' || echo '❌ FAILED'; })"; echo
            echo "| Metric | Value |"; echo "|---|---|"
            echo "| Tests | $TESTS |"
            echo "| Coverage of changed lines (min ${DIFF_COVERAGE_MIN}%) | $DIFF |"
            echo "| Commit | \`${HEAD_SHA:0:7}\` |"; echo
            [ -f diff-cover.md ] && cat diff-cover.md
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: Prithish-Ghosh/semgrep/actions/comment@v1.0.3
        if: always()
        with:
          marker: gate-coverage
          file: report.md
          token: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            ${{ inputs.coverage-file }}
            diff-cover.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce gate
        run: '[ "$(cat fail.txt)" = "0" ]'